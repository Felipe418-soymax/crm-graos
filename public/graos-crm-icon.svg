<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <!-- Simplified tractor + silo + handshake icon -->
  <g stroke="#e2e8f0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Silo -->
    <rect x="300" y="100" width="60" height="160" rx="6"/>
    <path d="M300 130 L330 90 L360 130"/>
    <line x1="300" y1="160" x2="360" y2="160"/>
    <!-- Tractor body -->
    <rect x="140" y="140" width="120" height="70" rx="8"/>
    <rect x="120" y="160" width="30" height="50" rx="4"/>
    <line x1="160" y1="140" x2="160" y2="120"/>
    <line x1="160" y1="120" x2="220" y2="120"/>
    <!-- Tractor wheels -->
    <circle cx="170" cy="240" r="30" stroke-width="10"/>
    <circle cx="250" cy="240" r="20" stroke-width="8"/>
    <!-- Handshake -->
    <path d="M150 320 L200 290 L260 290 L310 320"/>
    <path d="M200 290 C220 310, 240 310, 260 290"/>
    <path d="M150 320 L130 350 L180 380 L230 350"/>
    <path d="M310 320 L330 350 L280 380 L230 350"/>
  </g>
  <!-- Brand text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="60" fill="#ffffff">GRÃOS</text>
  <text x="256" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="36" fill="#16a34a">CRM</text>
</svg>
